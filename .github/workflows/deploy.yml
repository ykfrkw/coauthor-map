name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 側のキューが混むと deployment_queued のまま待たされる。既定の
          # 10 分では足りずに何度も打ち切られた（2026-08-06 に 3 回）。打ち切られると
          # そのコミット SHA のデプロイが「キャンセル済み」として残り、rerun しても
          # 同じ SHA を掴んで即 Deployment cancelled になる。抜けるには新しいコミットを
          # 積むしかないので、そもそも待てる時間を延ばしておく。
          timeout: 1800000
