name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pages 側のキューが混むと deployment_queued のまま待たされ、
        # 「Timeout reached, aborting!」で打ち切られる（2026-08-06 に 4 回）。
        #
        # timeout: 1800000 を渡して 30 分に延ばそうとしたが効かなかった。ログ上は
        # timeout: 1800000 と表示されるのに、実際は 10 分 5 秒で打ち切られる。
        # deploy-pages 側に上限があるとみられ、入力では延ばせない。
        #
        # 打ち切られるとその SHA のデプロイが deployment_cancelled として残り、
        # rerun も workflow_dispatch も同じ SHA を掴んで即死する。抜けるには
        # 新しいコミットを積むしかない。滞留が別 SHA に残っている場合は
        #   gh api -i --method POST repos/OWNER/REPO/pages/deployments/SHA/cancel
        # で明示的にキャンセルしてから push する（-i を付けないと 204 が空表示になる）。
