<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Co-author map</title>
    <meta name="robots" content="noindex" />
  </head>
  <body data-mode="widget">
    <div class="widget">
      <!-- Filled in only with ?controls=on; see src/ui/panels.js -->
      <div class="card widget-controls-card" id="controls" hidden></div>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="map-wrap" id="map"></div>
      <div class="map-legend" id="legend"></div>
      <div id="shown"></div>
      <!-- The three panels below are filled in only with ?controls=on; see
           src/ui/panels.js. Together they carry everything the full tool does,
           so nothing here has to send the reader to another page.
           All three are collapsed by default so they never push the map down. -->
      <details class="card widget-panel-card" id="corrections-panel" hidden>
        <summary data-i18n="widget.corrections"></summary>
        <h2 class="widget-panel-heading" data-i18n="auth.heading"></h2>
        <div id="authors"></div>
        <h2 class="widget-panel-heading" data-i18n="cur.heading"></h2>
        <div id="curation"></div>
      </details>
      <details class="card widget-panel-card" id="tables-panel" hidden>
        <summary data-i18n="table.heading"></summary>
        <div class="section" id="table"></div>
      </details>
      <details
        class="card widget-panel-card widget-embed-card"
        id="embed-panel"
        hidden
      >
        <summary data-i18n="embed.heading"></summary>
        <div id="embed"></div>
      </details>
      <!-- Shown only when this page is opened on its own; see src/main.js -->
      <p class="widget-credit" id="widget-credit" hidden>
        Made with
        <a
          href="https://yukifurukawa.jp/coauthor-map/"
          target="_blank"
          rel="noopener"
          >coauthor-map</a
        >
      </p>
      <script>
        if (window.parent === window) {
          document.getElementById('widget-credit').hidden = false;
        }
      </script>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/embed-height.js"></script>
  </body>
</html>
